name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapstudy
          POSTGRES_PASSWORD: snapstudy
          POSTGRES_DB: snapstudy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapstudy -d snapstudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql+asyncpg://snapstudy:snapstudy@localhost:5432/snapstudy
      GEMINI_API_KEY: ci-placeholder
      STORAGE_BUCKET: ci-bucket
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ci-access
      STORAGE_SECRET_KEY: ci-secret
      COOKIE_SECRET: ci-cookie-secret
      SESSION_SECRET: ci-session-secret
      CORS_ORIGINS: http://localhost:5173
      ENV: test
      DISABLE_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Production build
        run: npm run build
